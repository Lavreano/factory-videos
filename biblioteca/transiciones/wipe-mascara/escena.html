<!--
  wipe-mascara — Transición. Un panel entra barriendo con clip-path, tapa el corte y
  sale barriendo hacia el otro lado. Montar centrado en el corte: start = corte − 0.25.
  Duración: 0.5 s.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #wipe-capa, #wipe-panel { position: absolute; inset: 0; }
    #wipe-panel.acento { background: var(--color-accent); }
    #wipe-panel.superficie { background: var(--color-surface-2); }
    #wipe-panel.fondo { background: var(--color-bg); }
  </style>
  <div id="root" data-composition-id="wipe" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"color","type":"enum","label":"Color del panel","default":"acento","options":[{"value":"acento","label":"Acento"},{"value":"superficie","label":"Superficie"},{"value":"fondo","label":"Fondo"}]},
      {"id":"direccion","type":"enum","label":"Dirección","default":"izquierda","options":[{"value":"izquierda","label":"Hacia la izquierda"},{"value":"arriba","label":"Hacia arriba"}]}
    ]'>
    <div id="wipe-capa" class="clip" data-start="0" data-duration="0.5" data-layout-ignore><div id="wipe-panel"></div></div>
  </div>
  <script>
    (function () {
      var ID = "wipe";
      var V = Estudio.vars(ID);
      var panel = document.getElementById("wipe-panel");
      panel.classList.add(V.color || "acento");
      var vertical = V.direccion === "arriba";
      // Mismas unidades (%) en los cuatro lados: GSAP no interpola entre % y px.
      var cerrado = vertical ? "inset(100% 0% 0% 0%)" : "inset(0% 0% 0% 100%)";
      var lleno = "inset(0% 0% 0% 0%)";
      var salida = vertical ? "inset(0% 0% 100% 0%)" : "inset(0% 100% 0% 0%)";
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(panel, { clipPath: cerrado }, { clipPath: lleno, duration: 0.24, ease: "power3.in" }, 0);
      tl.fromTo(panel, { clipPath: lleno }, { clipPath: salida, duration: 0.24, ease: "power3.out", immediateRender: false }, 0.25);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
