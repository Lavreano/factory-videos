<!--
  cta-palabra-clave — Bloque 7 (Urgencia + CTA).
  "Comentá" + la palabra clave enorme (ajustada al ancho), letra por letra, dentro de
  un marco que se dibuja y un brillo que late dos veces. Todo en la banda segura.
  Duración por defecto: 3 s. Ver README.md.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #cta-bloque { position: absolute; left: 80px; top: 520px; width: 860px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    #cta-filtro { font-family: var(--font-body); font-size: var(--text-body); color: var(--color-text-muted); margin-bottom: 30px; }
    #cta-pre {
      display: flex; align-items: center; gap: 20px;
      font-family: var(--font-display); font-weight: var(--weight-display-light); font-size: var(--text-h2);
      letter-spacing: var(--tracking-display); color: var(--color-text);
    }
    #cta-pre svg { width: 64px; height: 64px; }
    #cta-marco { position: relative; margin-top: 34px; padding: 34px 40px 40px; }
    #cta-borde { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #cta-brillo { position: absolute; inset: 0; border-radius: var(--radius-lg); box-shadow: var(--shadow-glow); background: var(--color-accent-soft); }
    #cta-palabra {
      position: relative; font-family: var(--font-display); font-weight: var(--weight-display);
      line-height: 0.9; letter-spacing: -0.02em; color: var(--color-accent); white-space: nowrap;
    }
    #cta-palabra .letra { display: inline-block; }
    #cta-detalle { margin-top: 40px; font-family: var(--font-body); font-size: var(--text-body); line-height: 1.25; color: var(--color-text); max-width: 820px; }
  </style>

  <div id="root" data-composition-id="cta" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"filtro","type":"string","label":"Filtro (opcional)","default":""},
      {"id":"pre","type":"string","label":"Texto antes","default":"Comentá"},
      {"id":"palabra","type":"string","label":"Palabra clave","default":"LANDING"},
      {"id":"detalle","type":"string","label":"Qué te mando","default":"y te mando el checklist."},
      {"id":"pulsos","type":"number","label":"Pulsos del brillo","default":2,"min":0,"max":4}
    ]'>
    <div id="cta-bloque" class="clip" data-start="0" data-duration="30" data-layout-allow-overflow>
      <div id="cta-filtro" data-var-text="filtro"></div>
      <div id="cta-pre">
        <svg viewBox="0 0 64 64"><path d="M10 14 H54 V44 H28 L16 54 V44 H10 Z" fill="none" stroke="var(--color-accent)" stroke-width="4" stroke-linejoin="round" /></svg>
        <span id="cta-pre-texto" data-var-text="pre">Comentá</span>
      </div>
      <div id="cta-marco">
        <div id="cta-brillo"></div>
        <svg id="cta-borde"><rect id="cta-rect" x="0" y="0" rx="20" ry="20" fill="none" stroke="var(--color-accent)" stroke-width="4" /></svg>
        <div id="cta-palabra" data-var-text="palabra">LANDING</div>
      </div>
      <div id="cta-detalle" data-var-text="detalle">y te mando el checklist.</div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "cta";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 3);

      document.fonts.ready.then(function () {
        var palabra = document.getElementById("cta-palabra");
        var txt = String(V.palabra || "").trim().toUpperCase();
        // Tamaño: que la palabra ocupe ~760 px de ancho, con tope de 260 px.
        // Se mide a 100 px con la fuente ya cargada y se escala (una sola medición).
        palabra.textContent = txt;
        palabra.style.display = "inline-block";
        palabra.style.fontSize = "100px";
        var ancho100 = palabra.getBoundingClientRect().width || 1;
        palabra.style.fontSize = Math.min(260, Math.floor((760 / ancho100) * 100)) + "px";
        palabra.textContent = "";
        var letras = txt.split("").map(function (c) {
          var s = document.createElement("span");
          s.className = "letra";
          s.textContent = c;
          palabra.appendChild(s);
          return s;
        });
        if (!String(V.filtro || "").trim()) document.getElementById("cta-filtro").style.display = "none";

        // Marco SVG del tamaño real.
        var marco = document.getElementById("cta-marco");
        var rect = document.getElementById("cta-rect");
        var w = marco.offsetWidth, h = marco.offsetHeight;
        rect.setAttribute("width", w); rect.setAttribute("height", h);
        var perimetro = 2 * (w + h);

        var enter = Estudio.ease("enter"), exit = Estudio.ease("exit"), move = Estudio.ease("move");
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#cta-filtro", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: enter }, 0);
        tl.fromTo("#cta-pre", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: enter }, 0.05);
        tl.fromTo(letras, { opacity: 0, y: 70, scale: 0.9, filter: "blur(12px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: enter, stagger: 0.045 }, 0.25);
        tl.fromTo(rect, { strokeDasharray: perimetro, strokeDashoffset: perimetro }, { strokeDashoffset: 0, duration: 0.7, ease: move }, 0.45);
        tl.fromTo("#cta-brillo", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.8);
        tl.fromTo("#cta-detalle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: enter }, 0.5);

        // Brillo que late una cantidad FINITA de veces (nada de repeat: -1).
        var pulsos = Math.max(0, Math.floor(Number(V.pulsos) || 0));
        for (var i = 0; i < pulsos; i++) {
          var t0 = 1.3 + i * 0.7;
          if (t0 + 0.6 > dur - 0.35) break;
          tl.to("#cta-brillo", { opacity: 0.35, duration: 0.3, ease: "sine.inOut" }, t0);
          tl.to("#cta-brillo", { opacity: 1, duration: 0.3, ease: "sine.inOut" }, t0 + 0.3);
        }
        // El último fotograma queda con la palabra en pantalla (sin salida): es el final del reel.
        window.__timelines[ID] = tl;
        void exit;
      });
    })();
  </script>
</template>
