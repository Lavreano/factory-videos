<!--
  particulas — Fondo. Partículas con semilla (posición, tamaño, velocidad) que suben
  despacio; unas pocas en el acento. Movimiento lineal en función del tiempo.
  Duración: la del slot.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--color-bg); }
    #part-capa { position: absolute; inset: 0; }
    .part { position: absolute; border-radius: 50%; background: var(--color-text); }
    .part.acento { background: var(--color-accent); box-shadow: 0 0 18px var(--color-glow); }
  </style>
  <div id="root" data-composition-id="particulas" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"semilla","type":"number","label":"Semilla","default":21},
      {"id":"cantidad","type":"number","label":"Cantidad","default":70,"min":10,"max":200}
    ]'>
    <div id="part-capa" class="clip" data-start="0" data-duration="300" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      var ID = "particulas";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 10);
      var rnd = Estudio.prng(Number(V.semilla) || 21);
      var n = Math.max(10, Math.min(200, Number(V.cantidad) || 70));
      var capa = document.getElementById("part-capa");
      var tl = gsap.timeline({ paused: true });
      for (var i = 0; i < n; i++) {
        var p = document.createElement("div");
        var acento = rnd() < 0.1;
        var s = 2 + rnd() * (acento ? 7 : 5);
        p.className = "part" + (acento ? " acento" : "");
        p.style.width = p.style.height = s.toFixed(1) + "px";
        p.style.left = (rnd() * 1080).toFixed(0) + "px";
        p.style.top = (rnd() * 1920).toFixed(0) + "px";
        capa.appendChild(p);
        var vel = 15 + rnd() * 45; // px por segundo
        var deriva = (rnd() - 0.5) * 30;
        var op = acento ? 0.9 : 0.12 + rnd() * 0.3;
        tl.fromTo(p, { y: 0, x: 0, opacity: op }, { y: -vel * dur, x: deriva * dur * 0.2, duration: dur, ease: "none" }, 0);
      }
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
