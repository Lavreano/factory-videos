<!--
  grano-gradiente — Fondo. Gradiente radial suave con el acento de la marca y grano de
  película animado (feTurbulence con semilla que cambia 12 veces por segundo, determinístico).
  Duración: la del slot.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #grano-base { position: absolute; inset: 0; background:
      radial-gradient(900px 700px at 80% 12%, var(--color-accent-soft), transparent 70%),
      radial-gradient(1000px 900px at 10% 95%, var(--color-surface-2), transparent 70%),
      var(--color-bg); }
    #grano-ruido { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; mix-blend-mode: overlay; }
  </style>
  <div id="root" data-composition-id="grano" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"semilla","type":"number","label":"Semilla","default":3},
      {"id":"fps_grano","type":"number","label":"Cambios de grano por segundo","default":12}
    ]'>
    <div id="grano-base" class="clip" data-start="0" data-duration="300" data-layout-ignore></div>
    <svg id="grano-ruido" class="clip" data-start="0" data-duration="300" data-layout-ignore viewBox="0 0 1080 1920">
      <filter id="grano-filtro"><feTurbulence id="grano-turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
      <rect width="1080" height="1920" filter="url(#grano-filtro)" />
    </svg>
  </div>
  <script>
    (function () {
      var ID = "grano";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 10);
      var base = Number(V.semilla) || 3, fps = Number(V.fps_grano) || 12;
      var turb = document.getElementById("grano-turb");
      var ruido = document.getElementById("grano-ruido");
      ruido.style.opacity = Estudio.num("--grain-opacity", 0.07) * 4;
      var est = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(est, { t: 0 }, {
        t: dur, duration: dur, ease: "none",
        onUpdate: function () { turb.setAttribute("seed", String(base + Math.floor(est.t * fps))); },
      }, 0);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
