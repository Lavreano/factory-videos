<!--
  grilla-brillo — Fondo. Grilla técnica fina con un brillo del acento que recorre la
  pantalla lentamente de arriba hacia abajo. Bordes desvanecidos.
  Duración: la del slot.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--color-bg); }
    #grilla-lineas { position: absolute; inset: -2px;
      background-image: linear-gradient(var(--grid-color) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid-color) 1.5px, transparent 1.5px);
      background-size: 90px 90px; background-position: 45px 0;
      -webkit-mask-image: radial-gradient(1100px 1500px at 50% 45%, #000 40%, transparent 100%);
      mask-image: radial-gradient(1100px 1500px at 50% 45%, #000 40%, transparent 100%); }
    #grilla-brillo { position: absolute; left: -200px; top: 0; width: 1480px; height: 700px;
      background: radial-gradient(closest-side, var(--color-glow), transparent); opacity: 0.35; }
  </style>
  <div id="root" data-composition-id="grilla" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"intensidad","type":"number","label":"Intensidad del brillo","default":0.35,"min":0,"max":1}
    ]'>
    <div id="grilla-brillo" class="clip" data-start="0" data-duration="300" data-layout-ignore></div>
    <div id="grilla-lineas" class="clip" data-start="0" data-duration="300" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      var ID = "grilla";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 10);
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#grilla-brillo", { y: -500, opacity: Number(V.intensidad) || 0.35 }, { y: 1700, duration: Math.max(4, dur), ease: "none" }, 0);
      tl.fromTo("#grilla-lineas", { y: 0 }, { y: -90, duration: Math.max(4, dur), ease: "none" }, 0);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
