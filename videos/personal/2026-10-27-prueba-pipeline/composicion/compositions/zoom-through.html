<!--
  zoom-through — Transición. Un círculo con el color de fondo crece desde un punto
  (el botón o el elemento que "se atraviesa") hasta tapar todo, con un anillo de acento
  adelante; después se disuelve sobre la escena nueva.
  Montar centrado en el corte: start = corte − 0.35. Duración: 0.6 s.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #zoom-clip, #zoom-capa { position: absolute; inset: 0; }
    #zoom-circulo, #zoom-anillo { position: absolute; width: 200px; height: 200px; border-radius: 50%; }
    #zoom-circulo { background: var(--color-bg); }
    #zoom-anillo { border: 6px solid var(--color-accent); }
  </style>
  <div id="root" data-composition-id="zoomthrough" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"x","type":"number","label":"Centro X (px)","default":540},
      {"id":"y","type":"number","label":"Centro Y (px)","default":960}
    ]'>
    <div id="zoom-clip" class="clip" data-start="0" data-duration="0.6" data-layout-ignore>
      <div id="zoom-capa">
        <div id="zoom-circulo"></div>
        <div id="zoom-anillo"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var ID = "zoomthrough";
      var V = Estudio.vars(ID);
      var x = Number(V.x) || 540, y = Number(V.y) || 960;
      ["zoom-circulo", "zoom-anillo"].forEach(function (id) {
        var el = document.getElementById(id);
        el.style.left = x - 100 + "px";
        el.style.top = y - 100 + "px";
      });
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#zoom-anillo", { scale: 0.05, opacity: 1 }, { scale: 26, opacity: 0.6, duration: 0.35, ease: "power3.in" }, 0);
      tl.fromTo("#zoom-circulo", { scale: 0.02 }, { scale: 24, duration: 0.35, ease: "power3.in" }, 0.03);
      tl.fromTo("#zoom-capa", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.out" }, 0.37);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
