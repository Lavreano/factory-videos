<!doctype html>
<!--
  Composición raíz del reel prueba-pipeline — marca: personal — A-0 (reel de prueba del pipeline).
  Storyboard: ../storyboard.md. Colores y fuentes: SOLO desde assets/marca/tokens.css.
  Capas: fondo (1) → escenas (2) → transiciones (5).
-->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>prueba-pipeline</title>
    <link rel="stylesheet" href="assets/marca/tokens.css" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/estudio.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--color-bg); }
      #base { position: absolute; inset: 0; background: var(--color-bg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="base"></div>

      <!-- FONDO -->
      <div id="grilla" data-composition-id="grilla" data-composition-src="compositions/grilla-brillo.html"
        data-start="0" data-duration="15" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- 1. GANCHO 0–2.8 -->
      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho-tipografico.html"
        data-start="0" data-duration="2.8" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"
        data-variable-values='{"etiqueta":"A-0","linea1":"Tu landing es linda.","linea2":"Y no vende.","clave":"vende.","portada":true,"arriba":620}'></div>

      <!-- T1 -->
      <div id="wipe" data-composition-id="wipe" data-composition-src="compositions/wipe-mascara.html"
        data-start="2.55" data-duration="0.5" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"
        data-variable-values='{"color":"acento","direccion":"izquierda"}'></div>

      <!-- 2. ENEMIGO 2.8–5.6 -->
      <div id="enemigo" data-composition-id="enemigo" data-composition-src="compositions/enemigo-glitch.html"
        data-start="2.8" data-duration="2.8" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"
        data-variable-values='{"titulo":"Diseño de cartón.","sub":"Podría ser la landing de cualquiera.","clave":"cartón.","semilla":13}'></div>

      <!-- T2 -->
      <div id="desplazamiento" data-composition-id="desplazamiento" data-composition-src="compositions/desplazamiento.html"
        data-start="5.4" data-duration="0.4" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"
        data-variable-values='{"semilla":5,"sentido":"izquierda"}'></div>

      <!-- 3. BEFORE / AFTER 5.6–9.6 -->
      <div id="antesdespues" data-composition-id="antesdespues" data-composition-src="compositions/before-after.html"
        data-start="5.6" data-duration="4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"
        data-variable-values='{"titular":"Tu método, a la altura de tu oferta.","clave":"altura","rotulo":"DATO DE EJEMPLO"}'></div>

      <!-- 4. CONTADOR 9.6–12.3 -->
      <div id="contador" data-composition-id="contador" data-composition-src="compositions/prueba-contador.html"
        data-start="9.6" data-duration="2.7" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"
        data-variable-values='{"etiqueta":"RESULTADO","valor":38,"prefijo":"+","sufijo":"%","texto":"más clics en el botón principal","serie":"4,5,5,7,6,9,13,18,24,31,38","conteo":1.4,"rotulo":"DATO DE EJEMPLO"}'></div>

      <!-- T3 -->
      <div id="zoomthrough" data-composition-id="zoomthrough" data-composition-src="compositions/zoom-through.html"
        data-start="11.95" data-duration="0.6" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"
        data-variable-values='{"x":900,"y":990}'></div>

      <!-- 5. CTA 12.3–15 -->
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta-palabra-clave.html"
        data-start="12.3" data-duration="2.7" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"
        data-variable-values='{"pre":"Comentá","palabra":"LANDING","detalle":"y te mando el checklist.","pulsos":2}'></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
