<!--
  prueba-contador — Bloque 5 (Prueba).
  Una cifra grande cuenta hacia arriba (cifras tabulares, miles con punto) y un gráfico
  de línea se dibuja a la par. Rótulo "DATO DE EJEMPLO" visible si no es un dato real.
  Duración por defecto: 3 s. Ver README.md.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #contador-bloque { position: absolute; left: 80px; top: 300px; width: 860px; }
    #contador-etiqueta {
      font-family: var(--font-mono); font-size: var(--text-label); color: var(--color-text-muted);
      letter-spacing: var(--tracking-label); text-transform: var(--case-label);
    }
    #contador-numero {
      margin-top: 10px; display: flex; align-items: baseline;
      font-family: var(--font-display); font-weight: var(--weight-display); font-size: var(--text-number);
      line-height: 1; letter-spacing: -0.04em; color: var(--color-text);
      font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
    }
    #contador-numero .extremo { color: var(--color-accent); }
    #contador-sufijo { font-size: 0.55em; margin-left: 0.06em; }
    #contador-texto {
      margin-top: 18px; font-family: var(--font-display); font-weight: var(--weight-display-light);
      font-size: var(--text-h2); line-height: 1.05; letter-spacing: var(--tracking-display); color: var(--color-text);
    }
    #contador-texto .palabra { display: inline-block; }
    #contador-texto .clave { color: var(--color-accent); }
    #contador-grafico { position: absolute; left: 80px; top: 960px; width: 860px; height: 360px; }
    #contador-grafico svg { width: 860px; height: 360px; overflow: visible; }
    #contador-rotulo {
      position: absolute; left: 80px; top: 1380px; font-family: var(--font-mono); font-size: var(--text-label);
      color: var(--color-text-muted); letter-spacing: var(--tracking-label); border: var(--stroke) solid var(--color-border);
      padding: 8px 16px; border-radius: var(--radius-sm);
    }
  </style>

  <div id="root" data-composition-id="contador" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"etiqueta","type":"string","label":"Etiqueta","default":"RESULTADO"},
      {"id":"valor","type":"number","label":"Valor final","default":6000},
      {"id":"desde","type":"number","label":"Valor inicial","default":0},
      {"id":"decimales","type":"number","label":"Decimales","default":0},
      {"id":"prefijo","type":"string","label":"Prefijo","default":"+"},
      {"id":"sufijo","type":"string","label":"Sufijo","default":""},
      {"id":"texto","type":"string","label":"Texto bajo la cifra","default":"registros en un lanzamiento"},
      {"id":"clave","type":"string","label":"Palabras en acento (coma)","default":""},
      {"id":"serie","type":"string","label":"Serie del gráfico (coma)","default":"2,3,3,6,9,8,14,22,31,46,60"},
      {"id":"rotulo","type":"string","label":"Rótulo (vacío = sin rótulo)","default":"DATO DE EJEMPLO"},
      {"id":"conteo","type":"number","label":"Duración del conteo (s)","default":1.6}
    ]'>
    <div id="contador-bloque" class="clip" data-start="0" data-duration="30">
      <div id="contador-etiqueta" data-var-text="etiqueta">RESULTADO</div>
      <div id="contador-numero"><span id="contador-prefijo" class="extremo"></span><span id="contador-cifra">0</span><span id="contador-sufijo" class="extremo"></span></div>
      <div id="contador-texto" data-var-text="texto">registros en un lanzamiento</div>
    </div>
    <div id="contador-grafico" class="clip" data-start="0" data-duration="30" data-layout-allow-overflow>
      <svg viewBox="0 0 860 360">
        <g id="contador-guias"></g>
        <path id="contador-area" d="" fill="var(--color-accent-soft)" />
        <path id="contador-linea" d="" fill="none" stroke="var(--color-accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <circle id="contador-punto" r="13" fill="var(--color-accent)" />
        <circle id="contador-halo" r="13" fill="none" stroke="var(--color-accent)" stroke-width="3" />
      </svg>
    </div>
    <div id="contador-rotulo" class="clip" data-start="0" data-duration="30" data-var-text="rotulo">DATO DE EJEMPLO</div>
  </div>

  <script>
    (function () {
      var ID = "contador";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 3);

      document.fonts.ready.then(function () {
        var valor = Number(V.valor) || 0, desde = Number(V.desde) || 0, dec = Number(V.decimales) || 0;
        var conteo = Number(V.conteo) || 1.6;
        document.getElementById("contador-prefijo").textContent = V.prefijo || "";
        document.getElementById("contador-sufijo").textContent = V.sufijo || "";
        var cifra = document.getElementById("contador-cifra");
        cifra.textContent = Estudio.formato(desde, dec);
        var texto = Estudio.palabras(document.getElementById("contador-texto"), V.clave);
        var rotulo = document.getElementById("contador-rotulo");
        if (!String(V.rotulo || "").trim()) rotulo.style.opacity = "0";

        // Gráfico: serie normalizada a 860×360.
        var serie = Estudio.lista(V.serie, ",").map(Number).filter(function (n) { return !isNaN(n); });
        if (serie.length < 2) serie = [0, 1];
        var max = Math.max.apply(null, serie), min = Math.min.apply(null, serie);
        var pts = serie.map(function (v, i) {
          return [i * (860 / (serie.length - 1)), 330 - ((v - min) / ((max - min) || 1)) * 300];
        });
        var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
        var linea = document.getElementById("contador-linea");
        linea.setAttribute("d", d);
        document.getElementById("contador-area").setAttribute("d", d + " L 860 360 L 0 360 Z");
        var guias = document.getElementById("contador-guias");
        for (var g = 0; g < 4; g++) {
          var l = document.createElementNS("http://www.w3.org/2000/svg", "line");
          l.setAttribute("x1", 0); l.setAttribute("x2", 860); l.setAttribute("y1", 30 + g * 110); l.setAttribute("y2", 30 + g * 110);
          l.setAttribute("stroke", "var(--color-border)"); l.setAttribute("stroke-width", 1.5); l.setAttribute("stroke-dasharray", "4 10");
          guias.appendChild(l);
        }
        var largo = linea.getTotalLength();
        var punto = document.getElementById("contador-punto"), halo = document.getElementById("contador-halo");
        var fin = pts[pts.length - 1];

        var enter = Estudio.ease("enter"), exit = Estudio.ease("exit");
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#contador-etiqueta", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: enter }, 0);
        tl.fromTo("#contador-numero", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: enter }, 0.05);

        // Conteo: la cifra es función del progreso del tween (determinístico).
        var estado = { v: desde };
        tl.fromTo(estado, { v: desde }, {
          v: valor, duration: conteo, ease: "expo.out",
          onUpdate: function () { cifra.textContent = Estudio.formato(estado.v, dec); },
        }, 0.1);

        tl.fromTo(linea, { strokeDasharray: largo, strokeDashoffset: largo }, { strokeDashoffset: 0, duration: conteo, ease: "expo.out" }, 0.1);
        tl.fromTo("#contador-area", { opacity: 0 }, { opacity: 1, duration: conteo * 0.8, ease: "power2.out" }, 0.3);
        // El punto sigue el extremo de la línea.
        var p = { k: 0 };
        tl.fromTo(p, { k: 0 }, {
          k: 1, duration: conteo, ease: "expo.out",
          onUpdate: function () {
            var q = linea.getPointAtLength(largo * p.k);
            punto.setAttribute("cx", q.x); punto.setAttribute("cy", q.y);
            halo.setAttribute("cx", q.x); halo.setAttribute("cy", q.y);
          },
        }, 0.1);
        // El punto aparece con la línea (nunca suelto antes de que se dibuje).
        tl.fromTo(punto, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.12);
        // El halo queda invisible hasta su momento (un fromTo se aplica apenas se crea).
        tl.set(halo, { opacity: 0 }, 0);
        tl.fromTo(halo, { attr: { r: 13 }, opacity: 0.9 }, { attr: { r: 46 }, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 0.1 + conteo * 0.85);
        tl.fromTo(texto, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: enter, stagger: 0.05 }, 0.55);
        tl.fromTo(rotulo, { opacity: 0 }, { opacity: String(V.rotulo || "").trim() ? 1 : 0, duration: 0.3 }, 0.3);

        var salida = Math.max(conteo + 0.5, dur - 0.3);
        tl.to(["#contador-bloque", "#contador-grafico", "#contador-rotulo"], { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.25, ease: exit, stagger: 0.03 }, salida);
        punto.setAttribute("cx", 0); punto.setAttribute("cy", pts[0][1]);
        window.__timelines[ID] = tl;
        void fin;
      });
    })();
  </script>
</template>
