<!--
  pantallas-producto — Bloque 4 (Solución) · 5 (Prueba).
  A product monitor where real screenshots slide in one after another, each with
  its own caption below. Label + system name on top, slow camera push.
  Screens come from assets/media/ (real captures, never third-party data).
  Default duration: 8 s. See README.md.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #pantallas-cabecera { position: absolute; left: 80px; top: 250px; width: 860px; }
    #pantallas-etiqueta {
      font-family: var(--font-mono); font-size: var(--text-label); color: var(--color-text-muted);
      letter-spacing: var(--tracking-label); text-transform: var(--case-label);
    }
    #pantallas-nombre {
      margin-top: 16px; font-family: var(--font-display); font-weight: var(--weight-display);
      font-size: var(--text-h2); line-height: var(--leading-display); letter-spacing: var(--tracking-display);
      color: var(--color-text);
    }
    #pantallas-nombre .palabra { display: inline-block; }
    #pantallas-nombre .clave { color: var(--color-accent); }
    #pantallas-escena { position: absolute; left: 60px; top: 560px; width: 960px; height: 640px; }
    #pantallas-camara { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #pantallas-monitor {
      position: absolute; inset: 0; border-radius: var(--radius-lg); overflow: hidden;
      background: var(--color-surface); border: var(--stroke) solid var(--color-border);
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    #pantallas-barra {
      position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 10px;
      padding: 0 20px; background: var(--color-surface-2); border-bottom: var(--stroke) solid var(--color-border);
    }
    #pantallas-barra i { width: 12px; height: 12px; border-radius: 50%; background: var(--color-border); display: block; }
    #pantallas-vista { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; background: var(--color-bg); }
    .pantallas-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    #pantallas-textos { position: absolute; left: 80px; top: 1270px; width: 860px; height: 260px; }
    .pantallas-texto {
      position: absolute; left: 0; top: 0; width: 860px;
      font-family: var(--font-display); font-weight: var(--weight-display-light);
      font-size: var(--text-h2); line-height: 1.05; letter-spacing: var(--tracking-display); color: var(--color-text);
    }
    .pantallas-texto .palabra { display: inline-block; }
    .pantallas-texto .clave { color: var(--color-accent); font-weight: var(--weight-display); }
    #pantallas-indice {
      position: absolute; left: 80px; top: 1215px;
      font-family: var(--font-mono); font-size: var(--text-label); color: var(--color-accent);
      letter-spacing: var(--tracking-label);
    }
  </style>

  <div id="root" data-composition-id="pantallas" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"etiqueta","type":"string","label":"Etiqueta (mono, arriba)","default":"SISTEMA OPERATIVO DIGITAL"},
      {"id":"nombre","type":"string","label":"Nombre del sistema","default":"Tu método, convertido en plataforma."},
      {"id":"clave","type":"string","label":"Palabras en acento del nombre (coma)","default":"plataforma."},
      {"id":"imagenes","type":"string","label":"Capturas (rutas, coma)","default":""},
      {"id":"textos","type":"string","label":"Texto por captura (separados por |)","default":"Pantalla uno.|Pantalla dos.|Pantalla tres."},
      {"id":"claves","type":"string","label":"Palabras en acento de los textos (coma)","default":""},
      {"id":"empuje","type":"number","label":"Zoom de cámara al final","default":1.06}
    ]'>
    <div id="pantallas-cabecera" class="clip" data-start="0" data-duration="30">
      <div id="pantallas-etiqueta" data-var-text="etiqueta">SISTEMA OPERATIVO DIGITAL</div>
      <div id="pantallas-nombre" data-var-text="nombre">Tu método, convertido en plataforma.</div>
    </div>
    <div id="pantallas-escena" class="clip" data-start="0" data-duration="30" data-layout-allow-overflow>
      <div id="pantallas-camara">
        <div id="pantallas-monitor">
          <div id="pantallas-barra"><i></i><i></i><i></i></div>
          <div id="pantallas-vista"></div>
        </div>
      </div>
    </div>
    <div id="pantallas-indice" class="clip" data-start="0" data-duration="30">01</div>
    <div id="pantallas-textos" class="clip" data-start="0" data-duration="30"></div>
  </div>

  <script>
    (function () {
      var ID = "pantallas";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 8);

      document.fonts.ready.then(function () {
        var imagenes = Estudio.lista(V.imagenes, ",");
        var textos = Estudio.lista(V.textos, "|");
        var n = Math.max(imagenes.length, textos.length, 1);

        var vista = document.getElementById("pantallas-vista");
        var cajaTextos = document.getElementById("pantallas-textos");
        var imgs = [], frases = [];
        for (var i = 0; i < n; i++) {
          var img = document.createElement("img");
          img.className = "pantallas-img";
          img.alt = "";
          if (imagenes[i]) img.src = imagenes[i];
          vista.appendChild(img);
          imgs.push(img);
          var p = document.createElement("div");
          p.className = "pantallas-texto";
          p.textContent = textos[i] || "";
          cajaTextos.appendChild(p);
          frases.push(Estudio.palabras(p, V.claves));
        }
        var nombre = Estudio.palabras(document.getElementById("pantallas-nombre"), V.clave);
        var indice = document.getElementById("pantallas-indice");

        var enter = Estudio.ease("enter"), exit = Estudio.ease("exit"), move = Estudio.ease("move");
        var blur = Estudio.num("--blur-enter", 12), stg = Estudio.num("--stagger-word", 0.08);
        var tl = gsap.timeline({ paused: true });

        // Header and monitor in.
        tl.fromTo("#pantallas-etiqueta", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: enter }, 0);
        tl.fromTo(nombre, { opacity: 0, y: 30, filter: "blur(" + blur + "px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: enter, stagger: stg }, 0.05);
        tl.fromTo("#pantallas-monitor", { opacity: 0, y: 80, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: enter }, 0.15);
        tl.fromTo("#pantallas-camara", { scale: 1 }, { scale: Number(V.empuje) || 1.06, duration: dur, ease: "none" }, 0);

        // One beat per screen.
        var inicio = 0.45, salida = Math.max(inicio + n * 0.8, dur - 0.3);
        var paso = (salida - inicio) / n;
        imgs.forEach(function (img, i) {
          var t = inicio + i * paso;
          tl.set(img, { opacity: 0 }, 0);
          if (i === 0) {
            tl.fromTo(img, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: enter, immediateRender: false }, t);
          } else {
            tl.fromTo(img, { opacity: 1, xPercent: 100 }, { xPercent: 0, duration: 0.55, ease: move, immediateRender: false }, t);
            tl.to(imgs[i - 1], { xPercent: -30, opacity: 0.2, duration: 0.55, ease: move }, t);
          }
          var ws = frases[i];
          tl.set(ws, { opacity: 0 }, 0);
          tl.fromTo(ws, { opacity: 0, y: 30, filter: "blur(" + blur + "px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: enter, stagger: stg, immediateRender: false }, t + 0.15);
          if (i < n - 1) tl.to(ws, { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.2, ease: exit, stagger: 0.01 }, t + paso - 0.2);
        });
        // Screen counter as a function of timeline progress (seek-safe, no callbacks).
        var dos = function (k) { return (k < 10 ? "0" : "") + k; };
        var contador = { k: 0 };
        tl.fromTo(contador, { k: 0 }, {
          k: n, duration: salida - inicio, ease: "none",
          onUpdate: function () { indice.textContent = dos(Math.min(n, Math.floor(contador.k) + 1)) + " / " + dos(n); },
        }, inicio);
        tl.fromTo(indice, { opacity: 0 }, { opacity: 1, duration: 0.3 }, inicio);

        tl.to(["#pantallas-cabecera", "#pantallas-escena", "#pantallas-indice", "#pantallas-textos"],
          { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.25, ease: exit, stagger: 0.03 }, salida);
        indice.textContent = "01 / " + dos(n);
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
