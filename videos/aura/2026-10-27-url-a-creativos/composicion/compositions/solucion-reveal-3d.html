<!--
  solucion-reveal-3d — Bloque 4 (Solución con nombre propio).
  Una estructura de módulos 3D (Three.js) se levanta desde el piso mientras la cámara
  hace dolly-out y orbita; el módulo central brilla con el acento. Debajo aparece
  el nombre del método. Sin marca: colores desde tokens.css.
  Duración por defecto: 4.5 s. Ver README.md.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #reveal3d-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #reveal3d-velo {
      position: absolute; left: 0; top: 820px; width: 1080px; height: 1100px;
      background: linear-gradient(to bottom, transparent 0%, var(--color-bg) 34%, var(--color-bg) 100%);
    }
    #reveal3d-texto {
      position: absolute; left: 80px; top: 1010px; width: 860px;
      display: flex; flex-direction: column; gap: 28px;
    }
    #reveal3d-etiqueta {
      font-family: var(--font-mono); font-size: var(--text-label); color: var(--color-accent);
      letter-spacing: var(--tracking-label); text-transform: var(--case-label);
    }
    #reveal3d-etiqueta .palabra, #reveal3d-nombre .palabra { display: inline-block; }
    #reveal3d-nombre {
      font-family: var(--font-display); font-weight: var(--weight-display);
      font-size: var(--text-title); line-height: var(--leading-display);
      letter-spacing: var(--tracking-display); color: var(--color-text);
    }
    #reveal3d-nombre .clave { color: var(--color-accent); }
    #reveal3d-linea { width: 860px; height: var(--stroke); background: var(--color-border); transform-origin: left center; }
  </style>

  <div id="root" data-composition-id="reveal3d" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"etiqueta","type":"string","label":"Etiqueta","default":"EL MÉTODO"},
      {"id":"nombre","type":"string","label":"Nombre del método","default":"Sistema Landing de Autoridad"},
      {"id":"clave","type":"string","label":"Palabras en acento (coma)","default":"Autoridad"},
      {"id":"semilla","type":"number","label":"Semilla","default":7},
      {"id":"modulos","type":"number","label":"Módulos por lado","default":5,"min":3,"max":8}
    ]'>
    <canvas id="reveal3d-canvas" class="clip" data-start="0" data-duration="30" width="1080" height="1920"></canvas>
    <div id="reveal3d-velo" class="clip" data-start="0" data-duration="30"></div>
    <div id="reveal3d-texto" class="clip" data-start="0" data-duration="30">
      <div id="reveal3d-etiqueta" data-var-text="etiqueta">EL MÉTODO</div>
      <div id="reveal3d-linea"></div>
      <div id="reveal3d-nombre" data-var-text="nombre">Sistema Landing de Autoridad</div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "reveal3d";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 4.5);
      // El módulo 3D (abajo) avisa cuando terminó de construir la escena.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__reveal3d = { id: ID, vars: V, dur: dur };
      window.__hf.buildReady[ID] = new Promise(function (res) { window.__reveal3d.listo = res; });

      document.fonts.ready.then(function () {
        var enter = Estudio.ease("enter"), exit = Estudio.ease("exit"), move = Estudio.ease("move");
        var blur = Estudio.num("--blur-enter", 12), stg = Estudio.num("--stagger-word", 0.08);
        var et = Estudio.palabras(document.getElementById("reveal3d-etiqueta"), "");
        var nom = Estudio.palabras(document.getElementById("reveal3d-nombre"), V.clave);

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(et, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: enter, stagger: 0.05 }, 1.2);
        tl.fromTo("#reveal3d-linea", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: move }, 1.3);
        tl.fromTo(nom, { opacity: 0, y: 50, filter: "blur(" + blur + "px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: enter, stagger: stg }, 1.55);
        var salida = Math.max(2.6, dur - 0.32);
        tl.to("#reveal3d-texto", { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.25, ease: exit }, salida);
        window.__timelines[ID] = tl;
      });
    })();
  </script>

  <script type="module">
    import * as THREE from "./assets/lib/three.module.min.js";

    const R = window.__reveal3d;
    const V = R.vars;
    const dur = R.dur;
    const css = (n) => Estudio.token(n);

    const canvas = document.getElementById("reveal3d-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1080, 1920, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(new THREE.Color(css("--color-bg")), 16, 34);

    const camera = new THREE.PerspectiveCamera(32, 1080 / 1920, 0.1, 100);

    scene.add(new THREE.HemisphereLight(new THREE.Color(css("--color-text")), new THREE.Color(css("--color-bg")), 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(-8, 12, 6);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.8);
    fill.position.set(8, 3, 10);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(new THREE.Color(css("--color-accent")), 1.4);
    rim.position.set(6, 4, -6);
    scene.add(rim);

    // Módulos: grilla N×N de alturas con semilla; el central es el "núcleo" con acento.
    const rnd = Estudio.prng(Number(V.semilla) || 7);
    const N = Math.max(3, Math.min(8, Number(V.modulos) || 5));
    const gap = 1.15;
    const matBase = new THREE.MeshStandardMaterial({ color: new THREE.Color(css("--color-surface-2")), roughness: 0.55, metalness: 0.35 });
    const matNucleo = new THREE.MeshStandardMaterial({
      color: new THREE.Color(css("--color-accent")), emissive: new THREE.Color(css("--color-accent")),
      emissiveIntensity: 0.0, roughness: 0.3, metalness: 0.2,
    });
    const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(css("--color-text")), transparent: true, opacity: 0.22 });
    const geo = new THREE.BoxGeometry(1, 1, 1);
    geo.translate(0, 0.5, 0);
    const edges = new THREE.EdgesGeometry(geo);

    const centro = Math.floor(N / 2);
    const modulos = [];
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        const esNucleo = i === centro && j === centro;
        const dist = Math.hypot(i - centro, j - centro);
        const alto = esNucleo ? 4.4 : 0.5 + rnd() * 2.0 * (1 - dist / (N * 0.9));
        const grupo = new THREE.Group();
        const mesh = new THREE.Mesh(geo, esNucleo ? matNucleo : matBase);
        mesh.scale.set(0.92, alto, 0.92);
        const linea = new THREE.LineSegments(edges, lineMat);
        linea.scale.copy(mesh.scale);
        grupo.add(mesh, linea);
        grupo.position.set((i - centro) * gap, 0, (j - centro) * gap);
        scene.add(grupo);
        // Orden de aparición: del centro hacia afuera, con un leve desorden con semilla.
        modulos.push({ grupo, alto, esNucleo, orden: dist + rnd() * 0.6 });
      }
    }

    // Piso con grilla técnica.
    const grid = new THREE.GridHelper(40, 40, new THREE.Color(css("--color-border")), new THREE.Color(css("--color-border")));
    grid.material.transparent = true;
    grid.material.opacity = 0.5;
    scene.add(grid);

    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
    const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

    function renderAt(t) {
      // Módulos: suben uno tras otro (0.15 s → ~1.6 s).
      for (const m of modulos) {
        const p = outExpo(clamp01((t - 0.15 - m.orden * 0.22) / 0.7));
        m.grupo.scale.set(1, Math.max(0.0001, p), 1);
      }
      // Núcleo: el brillo aparece cuando aterriza.
      matNucleo.emissiveIntensity = 0.9 * inOut(clamp01((t - 1.0) / 0.8));

      // Cámara: dolly-out + órbita lenta (≈4° por segundo), mirando un poco arriba del piso.
      const k = inOut(clamp01(t / Math.max(1, dur)));
      const radio = 15 + k * 5;
      const ang = -0.75 + t * 0.07;
      const altura = 11 - k * 2;
      camera.position.set(Math.cos(ang) * radio, altura, Math.sin(ang) * radio);
      camera.lookAt(0, 1.6, 0);
      // Desplaza el encuadre: el objeto vive en la mitad superior, el texto abajo.
      camera.setViewOffset(1080, 1920, 0, 400, 1080, 1920);
      renderer.render(scene, camera);
    }

    // hf-seek entrega el tiempo GLOBAL del reel: se pasa a tiempo local de la escena.
    window.addEventListener("hf-seek", (e) => renderAt(Estudio.tiempoLocal(R.id, e.detail.time)));
    renderAt(0);
    R.listo();
  </script>
</template>
