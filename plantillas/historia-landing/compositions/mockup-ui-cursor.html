<!--
  mockup-ui-cursor — Bloque 4/5 (Solución, proceso en vivo).
  Ventana de app o landing con un cursor falso que hace clic en un campo, escribe,
  hace clic en el botón y muestra el éxito. Zoom de cámara estilo Screen Studio.
  Duración por defecto: 5 s. Ver README.md.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #mockup-camara { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 800px; }
    #mockup-ventana {
      position: absolute; left: 90px; top: 330px; width: 900px; height: 960px;
      background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border); overflow: hidden;
    }
    #mockup-ventana .barra { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); }
    #mockup-ventana .punto { width: 16px; height: 16px; border-radius: 50%; background: var(--color-border); }
    #mockup-url { margin-left: 16px; flex: 1; height: 36px; border-radius: var(--radius-pill); background: var(--color-bg); color: var(--color-text-muted); font-family: var(--font-mono); font-size: 20px; line-height: 36px; padding-left: 18px; }
    #mockup-contenido { position: absolute; left: 60px; right: 60px; top: 150px; }
    #mockup-titulo { font-family: var(--font-display); font-weight: var(--weight-display); font-size: 76px; line-height: var(--leading-display); letter-spacing: var(--tracking-display); color: var(--color-text); }
    #mockup-bajada { margin-top: 22px; font-family: var(--font-body); font-size: 32px; line-height: 1.35; color: var(--color-text-muted); }
    #mockup-etiqueta { margin-top: 60px; font-family: var(--font-mono); font-size: 22px; letter-spacing: var(--tracking-label); color: var(--color-text-muted); text-transform: var(--case-label); }
    #mockup-campo {
      margin-top: 14px; height: 96px; border-radius: var(--radius-md); border: var(--stroke) solid var(--color-border);
      background: var(--color-bg); display: flex; align-items: center; padding: 0 28px;
      font-family: var(--font-body); font-size: 36px; color: var(--color-text);
    }
    #mockup-caret { display: inline-block; width: 3px; height: 44px; margin-left: 4px; background: var(--color-accent); }
    #mockup-boton {
      margin-top: 30px; height: 100px; border-radius: var(--radius-md); background: var(--color-accent); color: var(--color-accent-contrast);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-body); font-weight: var(--weight-strong); font-size: 36px;
    }
    #mockup-exito {
      position: absolute; left: 60px; right: 60px; top: 800px; height: 92px; border-radius: var(--radius-md);
      background: var(--color-surface-2); border: var(--stroke) solid var(--color-success); color: var(--color-text);
      display: flex; align-items: center; gap: 18px; padding: 0 28px; font-family: var(--font-body); font-size: 30px;
    }
    #mockup-exito i { display: block; width: 36px; height: 36px; border-radius: 50%; background: var(--color-success); }
    #mockup-cursor { position: absolute; left: 0; top: 0; width: 54px; height: 66px; }
  </style>

  <div id="root" data-composition-id="mockup" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"url","type":"string","label":"URL","default":"tunegocio.com/programa"},
      {"id":"titulo","type":"string","label":"Título de la pantalla","default":"Reservá tu lugar"},
      {"id":"bajada","type":"string","label":"Bajada","default":"Dejá tu email y te mandamos el acceso."},
      {"id":"etiqueta","type":"string","label":"Etiqueta del campo","default":"Tu email"},
      {"id":"tipeo","type":"string","label":"Texto que se escribe","default":"vos@tunegocio.com"},
      {"id":"boton","type":"string","label":"Botón","default":"Quiero entrar"},
      {"id":"exito","type":"string","label":"Mensaje de éxito","default":"Listo. Ya estás adentro."},
      {"id":"zoom","type":"number","label":"Zoom de cámara","default":1.45,"min":1,"max":2.2}
    ]'>
    <div id="mockup-escena" class="clip" data-start="0" data-duration="30" data-layout-allow-overflow>
      <div id="mockup-camara">
        <div id="mockup-ventana">
          <div class="barra"><span class="punto"></span><span class="punto"></span><span class="punto"></span><span id="mockup-url" data-var-text="url">tunegocio.com/programa</span></div>
          <div id="mockup-exito"><i></i><span data-var-text="exito">Listo. Ya estás adentro.</span></div>
          <div id="mockup-contenido">
            <div id="mockup-titulo" data-var-text="titulo">Reservá tu lugar</div>
            <div id="mockup-bajada" data-var-text="bajada">Dejá tu email y te mandamos el acceso.</div>
            <div id="mockup-etiqueta" data-var-text="etiqueta">Tu email</div>
            <div id="mockup-campo"><span id="mockup-texto"></span><span id="mockup-caret"></span></div>
            <div id="mockup-boton" data-var-text="boton">Quiero entrar</div>
          </div>
        </div>
        <svg id="mockup-cursor" viewBox="0 0 54 66">
          <path d="M4 3 L4 52 L17 40 L26 61 L35 57 L26 37 L44 37 Z" fill="var(--color-text)" stroke="var(--color-bg)" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "mockup";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 5);

      document.fonts.ready.then(function () {
        var ventana = document.getElementById("mockup-ventana");
        var campo = document.getElementById("mockup-campo");
        var boton = document.getElementById("mockup-boton");
        var texto = document.getElementById("mockup-texto");
        var tipeo = String(V.tipeo || "");
        var zoom = Number(V.zoom) || 1.45;

        // Posiciones medidas una sola vez, antes de crear los tweens.
        function centro(el) {
          var x = 0, y = 0, n = el;
          while (n && n !== document.getElementById("mockup-camara")) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
          return { x: x + el.offsetWidth * 0.32, y: y + el.offsetHeight * 0.55 };
        }
        var pCampo = centro(campo), pBoton = centro(boton);

        var enter = Estudio.ease("enter"), exit = Estudio.ease("exit"), move = Estudio.ease("move"), spring = Estudio.ease("spring");
        var tl = gsap.timeline({ paused: true });

        tl.fromTo(ventana, { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: spring }, 0);
        tl.fromTo("#mockup-exito", { opacity: 0, y: 30 }, { opacity: 0, y: 30, duration: 0.01 }, 0);
        tl.fromTo("#mockup-caret", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        // Cursor: entra desde abajo a la derecha y va al campo.
        tl.set("#mockup-cursor", { x: 1000, y: 1500 }, 0);
        tl.fromTo("#mockup-cursor", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.4);
        tl.to("#mockup-cursor", { x: pCampo.x, y: pCampo.y, duration: 0.75, ease: move }, 0.5);

        // Cámara: zoom al campo (estilo Screen Studio).
        tl.fromTo("#mockup-camara", { scale: 1, x: 0, y: 0 }, {
          scale: zoom, x: (540 - pCampo.x) * (zoom - 1) * 0.9, y: (800 - pCampo.y) * (zoom - 1) * 0.9,
          duration: 0.6, ease: move,
        }, 1.0);

        // Clic en el campo + foco.
        tl.to("#mockup-cursor", { scale: 0.82, duration: 0.08, ease: "power2.in", transformOrigin: "10% 10%" }, 1.3);
        tl.to("#mockup-cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, 1.38);
        tl.to(campo, { borderColor: Estudio.token("--color-accent"), duration: 0.15 }, 1.32);
        tl.to("#mockup-caret", { opacity: 1, duration: 0.01 }, 1.35);

        // Tipeo: cantidad de caracteres en función del tiempo (steps implícito por floor).
        var est = { n: 0 }, tTipeo = Math.min(1.1, Math.max(0.5, tipeo.length * 0.05));
        tl.fromTo(est, { n: 0 }, {
          n: tipeo.length, duration: tTipeo, ease: "none",
          onUpdate: function () { texto.textContent = tipeo.slice(0, Math.floor(est.n)); },
        }, 1.45);

        // Zoom out, cursor al botón, clic.
        var t2 = 1.45 + tTipeo + 0.1;
        tl.to("#mockup-camara", { scale: 1, x: 0, y: 0, duration: 0.55, ease: move }, t2);
        tl.to("#mockup-cursor", { x: pBoton.x, y: pBoton.y, duration: 0.55, ease: move }, t2 + 0.05);
        tl.to("#mockup-caret", { opacity: 0, duration: 0.01 }, t2 + 0.3);
        tl.to("#mockup-cursor", { scale: 0.82, duration: 0.08, ease: "power2.in" }, t2 + 0.62);
        tl.to("#mockup-cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, t2 + 0.7);
        tl.to(boton, { scale: 0.96, duration: 0.08, ease: "power2.in" }, t2 + 0.62);
        tl.to(boton, { scale: 1, duration: 0.25, ease: spring }, t2 + 0.7);

        // Éxito.
        tl.to("#mockup-exito", { opacity: 1, y: 0, duration: 0.4, ease: enter }, t2 + 0.8);
        tl.to("#mockup-cursor", { opacity: 0, duration: 0.25 }, t2 + 1.1);

        var salida = Math.max(t2 + 1.3, dur - 0.3);
        tl.to("#mockup-escena", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: exit }, salida);
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
