<!--
  enemigo-glitch — Bloque 3 (Enemigo común).
  Una web genérica y gris (solo tokens --color-ugly-*) entra, se "rompe" con un glitch
  de franjas con semilla y queda tachada; arriba aparece el nombre del enemigo.
  Duración por defecto: 3 s. Ver README.md.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #enemigo-escenario { position: absolute; left: 110px; top: 640px; width: 860px; height: 760px; }
    .enemigo-web {
      position: absolute; left: 0; top: 0; width: 860px; height: 760px; overflow: hidden;
      background: var(--color-ugly-surface); border-radius: var(--radius-sm);
      font-family: Arial, sans-serif; color: var(--color-ugly-text);
    }
    .enemigo-web .barra { height: 54px; background: var(--color-ugly-bg); display: flex; align-items: center; gap: 12px; padding: 0 22px; }
    .enemigo-web .punto { width: 16px; height: 16px; border-radius: 50%; background: var(--color-ugly-accent); }
    .enemigo-web .url { margin-left: 18px; flex: 1; height: 30px; border-radius: 15px; background: var(--color-ugly-surface); font-size: 18px; line-height: 30px; padding-left: 16px; }
    .enemigo-web .nav { display: flex; justify-content: space-between; align-items: center; padding: 26px 40px; }
    .enemigo-web .logo { width: 140px; height: 36px; background: var(--color-ugly-accent); }
    .enemigo-web .links { display: flex; gap: 22px; }
    .enemigo-web .links i { display: block; width: 86px; height: 16px; background: var(--color-ugly-bg); }
    .enemigo-web .hero { margin: 8px 40px; height: 300px; background: var(--color-ugly-bg); position: relative; }
    .enemigo-web .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .enemigo-web .titulo { text-align: center; font-size: 46px; margin: 34px 40px 18px; color: var(--color-ugly-text); }
    .enemigo-web .renglon { height: 16px; background: var(--color-ugly-bg); margin: 12px auto; }
    .enemigo-web .botones { display: flex; gap: 22px; justify-content: center; margin-top: 34px; }
    .enemigo-web .boton { width: 210px; height: 64px; background: var(--color-ugly-accent); color: var(--color-ugly-surface); font-size: 24px; line-height: 64px; text-align: center; }
    #enemigo-franjas { position: absolute; inset: 0; }
    #enemigo-tacha { position: absolute; left: -30px; top: 380px; width: 920px; height: 14px; background: var(--color-danger); transform-origin: left center; }
    #enemigo-texto { position: absolute; left: 80px; top: 250px; width: 860px; }
    #enemigo-titulo {
      font-family: var(--font-display); font-weight: var(--weight-display); font-size: var(--text-title);
      line-height: var(--leading-display); letter-spacing: var(--tracking-display); color: var(--color-text);
    }
    #enemigo-sub { margin-top: 18px; font-family: var(--font-body); font-size: var(--text-body); color: var(--color-text-muted); }
    #enemigo-texto .palabra { display: inline-block; }
    #enemigo-texto .clave { color: var(--color-accent); }
  </style>

  <div id="root" data-composition-id="enemigo" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"titulo","type":"string","label":"Nombre del enemigo","default":"Diseño de cartón."},
      {"id":"sub","type":"string","label":"Bajada","default":"Podría ser la landing de cualquiera."},
      {"id":"clave","type":"string","label":"Palabras en acento (coma)","default":"cartón."},
      {"id":"url","type":"string","label":"URL falsa","default":"www.tunegocio.com"},
      {"id":"titulo_web","type":"string","label":"Titular de la web genérica","default":"Bienvenidos a nuestra web"},
      {"id":"boton_web","type":"string","label":"Texto de los botones","default":"Ver más"},
      {"id":"semilla","type":"number","label":"Semilla del glitch","default":13},
      {"id":"tachar","type":"boolean","label":"Tachar la web","default":true}
    ]'>
    <div id="enemigo-escenario" class="clip" data-start="0" data-duration="30" data-layout-allow-overflow>
      <!-- La web fea es ilustración (no copy a leer): fuera de la auditoría de layout. -->
      <div id="enemigo-web" class="enemigo-web" data-layout-ignore>
        <div class="barra"><span class="punto"></span><span class="punto"></span><span class="punto"></span><span class="url" id="enemigo-url" data-var-text="url">www.tunegocio.com</span></div>
        <div class="nav"><span class="logo"></span><span class="links"><i></i><i></i><i></i><i></i></span></div>
        <div class="hero"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="currentColor" stroke-width="0.4"/><line x1="100" y1="0" x2="0" y2="100" stroke="currentColor" stroke-width="0.4"/></svg></div>
        <div class="titulo" id="enemigo-titulo-web" data-var-text="titulo_web">Bienvenidos a nuestra web</div>
        <div class="renglon" style="width: 640px"></div>
        <div class="renglon" style="width: 560px"></div>
        <div class="botones"><span class="boton" data-var-text="boton_web">Ver más</span><span class="boton" data-var-text="boton_web">Ver más</span><span class="boton" data-var-text="boton_web">Ver más</span></div>
      </div>
      <div id="enemigo-franjas" data-layout-ignore></div>
      <div id="enemigo-tacha"></div>
    </div>
    <div id="enemigo-texto" class="clip" data-start="0" data-duration="30">
      <div id="enemigo-titulo" data-var-text="titulo">Diseño de cartón.</div>
      <div id="enemigo-sub" data-var-text="sub">Podría ser la landing de cualquiera.</div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "enemigo";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 3);

      document.fonts.ready.then(function () {
        var rnd = Estudio.prng(Number(V.semilla) || 13);
        var web = document.getElementById("enemigo-web");
        var capa = document.getElementById("enemigo-franjas");

        // Franjas del glitch: copias de la web recortadas en bandas horizontales.
        var N = 9, alto = 760, franjas = [];
        for (var i = 0; i < N; i++) {
          var y0 = Math.floor(rnd() * (alto - 60)), h = 18 + Math.floor(rnd() * 80);
          var c = web.cloneNode(true);
          c.removeAttribute("id");
          c.querySelectorAll("[id]").forEach(function (n) { n.removeAttribute("id"); });
          c.style.clipPath = "inset(" + y0 + "px 0 " + Math.max(0, alto - y0 - h) + "px 0)";
          capa.appendChild(c);
          franjas.push(c);
        }

        var titulo = Estudio.palabras(document.getElementById("enemigo-titulo"), V.clave);
        var sub = document.getElementById("enemigo-sub");
        var enter = Estudio.ease("enter"), exit = Estudio.ease("exit"), spring = Estudio.ease("spring");
        var tl = gsap.timeline({ paused: true });

        // 1. La web entra (spring-pop).
        tl.fromTo("#enemigo-escenario", { opacity: 0, scale: 0.94, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: spring }, 0);
        tl.fromTo(franjas, { opacity: 0, x: 0 }, { opacity: 0, x: 0, duration: 0.01 }, 0);

        // 2. Tres ráfagas de glitch con desplazamientos con semilla (cuadro a cuadro: steps).
        [0.75, 1.05, 1.3].forEach(function (t0, r) {
          franjas.forEach(function (f) {
            var dx = (rnd() - 0.5) * (170 + r * 90);
            tl.fromTo(f, { opacity: 1, x: dx }, { opacity: 1, x: -dx * 0.4, duration: 0.1, ease: "steps(2)" }, t0);
            tl.to(f, { opacity: 0, x: 0, duration: 0.01 }, t0 + 0.12);
          });
          tl.fromTo(web, { x: (rnd() - 0.5) * 24 }, { x: 0, duration: 0.12, ease: "steps(3)" }, t0);
        });

        // 3. Queda apagada y tachada.
        tl.to(web, { filter: "grayscale(1) brightness(0.7)", duration: 0.4, ease: "power2.out" }, 1.45);
        if (Estudio.si(V.tachar)) {
          tl.fromTo("#enemigo-tacha", { scaleX: 0, rotation: -8 }, { scaleX: 1, rotation: -8, duration: 0.35, ease: "power4.out" }, 1.5);
        } else {
          tl.set("#enemigo-tacha", { opacity: 0 }, 0);
        }

        // 4. El nombre del enemigo.
        tl.fromTo(titulo, { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: enter, stagger: 0.07 }, 0.2);
        tl.fromTo(sub, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: enter }, 0.55);

        // Salida.
        var salida = Math.max(2.0, dur - 0.3);
        tl.to(["#enemigo-escenario", "#enemigo-texto"], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.25, ease: exit, stagger: 0.04 }, salida);
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
