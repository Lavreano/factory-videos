<!--
  nosotros-vs-otros — Bloque 6 (Valor + objeción).
  Tabla comparativa: cada fila es un criterio; ✕ gris para "otros" y check en el acento
  para "nosotros". La columna "nosotros" se resalta con un marco que se dibuja.
  Duración por defecto: 4 s (4 filas). Ver README.md.
-->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #comparativa-tabla { position: absolute; left: 80px; top: 300px; width: 840px; }
    #comparativa-titulo {
      font-family: var(--font-display); font-weight: var(--weight-display); font-size: var(--text-h2);
      line-height: var(--leading-display); letter-spacing: var(--tracking-display); color: var(--color-text);
      margin-bottom: 56px;
    }
    #comparativa-titulo .palabra { display: inline-block; }
    #comparativa-titulo .clave { color: var(--color-accent); }
    #comparativa-cuerpo { position: relative; }
    .cmp-fila { position: relative; display: grid; grid-template-columns: 1fr 170px 170px; align-items: center; min-height: 118px; border-bottom: 1px solid var(--color-border); }
    .cmp-fila.cabecera { min-height: 70px; border-bottom: none; }
    .cmp-col { text-align: center; font-family: var(--font-mono); font-size: 24px; letter-spacing: var(--tracking-label); text-transform: var(--case-label); }
    .cmp-col.otros { color: var(--color-text-muted); }
    .cmp-col.nosotros { color: var(--color-accent); }
    .cmp-criterio { font-family: var(--font-body); font-size: var(--text-body); line-height: 1.15; color: var(--color-text); padding-right: 20px; }
    .cmp-celda { display: flex; justify-content: center; align-items: center; }
    .cmp-celda svg { width: 58px; height: 58px; overflow: visible; }
    #comparativa-marco {
      position: absolute; right: 0; width: 170px; border: var(--stroke) solid var(--color-accent);
      border-radius: var(--radius-md); background: var(--color-accent-soft); transform-origin: top center;
    }
  </style>

  <div id="root" data-composition-id="comparativa" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"titulo","type":"string","label":"Título","default":"No es lo mismo."},
      {"id":"clave","type":"string","label":"Palabras en acento (coma)","default":"mismo."},
      {"id":"col_otros","type":"string","label":"Columna otros","default":"Otros"},
      {"id":"col_nosotros","type":"string","label":"Columna nosotros","default":"Nosotros"},
      {"id":"filas","type":"string","label":"Filas (separadas por ;)","default":"Estructura pensada para vender;Diseño propio, no template;Publicada y funcionando;Un solo equipo"}
    ]'>
    <div id="comparativa-tabla" class="clip" data-start="0" data-duration="30">
      <div id="comparativa-titulo" data-var-text="titulo">No es lo mismo.</div>
      <div id="comparativa-cuerpo">
        <div id="comparativa-marco"></div>
        <div class="cmp-fila cabecera">
          <span></span>
          <span class="cmp-col otros" id="comparativa-c-otros" data-var-text="col_otros">Otros</span>
          <span class="cmp-col nosotros" id="comparativa-c-nos" data-var-text="col_nosotros">Nosotros</span>
        </div>
        <div id="comparativa-filas"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "comparativa";
      var V = Estudio.vars(ID);
      var dur = Estudio.slot(ID, 4);
      var NS = "http://www.w3.org/2000/svg";

      function icono(tipo) {
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 58 58");
        var paths = tipo === "x" ? ["M14 14 L44 44", "M44 14 L14 44"] : ["M10 30 L24 44 L48 16"];
        paths.forEach(function (d) {
          var p = document.createElementNS(NS, "path");
          p.setAttribute("d", d);
          p.setAttribute("fill", "none");
          p.setAttribute("stroke", tipo === "x" ? "var(--color-text-muted)" : "var(--color-accent)");
          p.setAttribute("stroke-width", tipo === "x" ? "5" : "7");
          p.setAttribute("stroke-linecap", "round");
          p.setAttribute("stroke-linejoin", "round");
          svg.appendChild(p);
        });
        return svg;
      }

      document.fonts.ready.then(function () {
        var filas = Estudio.lista(V.filas).slice(0, 6);
        var cont = document.getElementById("comparativa-filas");
        var items = filas.map(function (txt) {
          var f = document.createElement("div");
          f.className = "cmp-fila";
          var c = document.createElement("span"); c.className = "cmp-criterio"; c.textContent = txt;
          var o = document.createElement("span"); o.className = "cmp-celda"; o.appendChild(icono("x"));
          var n = document.createElement("span"); n.className = "cmp-celda"; n.appendChild(icono("v"));
          f.appendChild(c); f.appendChild(o); f.appendChild(n);
          cont.appendChild(f);
          return { fila: f, criterio: c, x: o.querySelector("svg"), v: n.querySelector("path") };
        });

        // Marco de la columna "nosotros": desde la cabecera hasta la última fila.
        var cuerpo = document.getElementById("comparativa-cuerpo");
        var marco = document.getElementById("comparativa-marco");
        marco.style.top = "-6px";
        marco.style.height = cuerpo.offsetHeight + 12 + "px";

        var titulo = Estudio.palabras(document.getElementById("comparativa-titulo"), V.clave);
        var enter = Estudio.ease("enter"), exit = Estudio.ease("exit"), move = Estudio.ease("move"), spring = Estudio.ease("spring");
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(titulo, { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: enter, stagger: 0.07 }, 0);
        tl.fromTo(["#comparativa-c-otros", "#comparativa-c-nos"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: enter, stagger: 0.08 }, 0.35);
        tl.fromTo(marco, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.6, ease: move }, 0.45);

        var paso = Math.min(0.42, Math.max(0.22, (dur - 1.6) / Math.max(1, items.length)));
        items.forEach(function (it, i) {
          var t0 = 0.75 + i * paso;
          tl.fromTo(it.criterio, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: enter }, t0);
          tl.fromTo(it.fila, { borderBottomColor: "rgba(0,0,0,0)" }, { borderBottomColor: Estudio.token("--color-border"), duration: 0.3 }, t0);
          tl.fromTo(it.x, { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.3, ease: spring }, t0 + 0.08);
          var largo = 60;
          tl.fromTo(it.v, { strokeDasharray: largo, strokeDashoffset: largo }, { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, t0 + 0.16);
        });

        var salida = Math.max(0.75 + items.length * paso + 0.4, dur - 0.3);
        tl.to("#comparativa-tabla", { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.25, ease: exit }, salida);
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
