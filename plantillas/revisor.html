<!doctype html>
<!--
  Reel reviewer: play the render frame by frame, click on the exact spot to leave a note.
  Each note keeps time + position. "Copiar para Claude" puts them on the clipboard, ready to paste.
  Generated by scripts/revisar.sh (placeholders {{VIDEO}} and {{REEL}}). Notes persist in localStorage.
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Revisor — {{REEL}}</title>
<style>
  :root { --bg:#0f0f10; --panel:#18181b; --line:#2a2a2e; --text:#ececee; --muted:#9b9ba3; --accent:#ff4d3d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; height: 100vh; display: flex; gap: 20px; padding: 18px; }
  #escenario { position: relative; height: calc(100vh - 110px); aspect-ratio: 9/16; align-self: flex-start; cursor: crosshair; border-radius: 12px; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; display: block; }
  .pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 13px system-ui; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(0,0,0,.45); pointer-events: none; }
  .zona { position: absolute; inset: 0; pointer-events: none; display: none; }
  .zona.on { display: block; }
  .zona i { position: absolute; left: 0; right: 0; background: rgba(255,77,61,.18); border: 1px dashed rgba(255,77,61,.7); }
  #izq { display: flex; flex-direction: column; gap: 10px; }
  #barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: calc((100vh - 110px) * 9 / 16); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primario { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #tiempo { font: 600 15px ui-monospace, Consolas, monospace; margin-left: auto; }
  input[type=range] { width: calc((100vh - 110px) * 9 / 16); accent-color: var(--accent); }
  #panel { flex: 1; min-width: 320px; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; } .sub { color: var(--muted); font-size: 13px; }
  #nueva { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: none; flex-direction: column; gap: 8px; }
  #nueva.on { display: flex; }
  textarea { background: #0b0b0c; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; min-height: 80px; resize: vertical; }
  #notas { list-style: none; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  #notas li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
  #notas li .n { background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
  #notas li .t { font: 600 13px ui-monospace, Consolas, monospace; color: var(--muted); cursor: pointer; }
  #notas li .x { background: none; border: 0; color: var(--muted); padding: 0 4px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .ayuda { color: var(--muted); font-size: 12px; line-height: 1.6; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
  <div id="izq">
    <div id="escenario">
      <video id="v" src="{{VIDEO}}" preload="auto" playsinline></video>
      <div class="zona" id="zona"><i style="top:0;height:11.46%"></i><i style="bottom:0;height:21.88%"></i></div>
    </div>
    <input id="scrub" type="range" min="0" max="1000" value="0" />
    <div id="barra">
      <button id="play">▶︎ Play</button>
      <button id="atras">◀ 1 cuadro</button>
      <button id="adelante">1 cuadro ▶</button>
      <button id="lento">Velocidad 1×</button>
      <button id="verzona">Zonas seguras</button>
      <span id="tiempo">0:00.00 · c0</span>
    </div>
  </div>

  <div id="panel">
    <div><h1>Revisor — {{REEL}}</h1><p class="sub">Pausá donde quieras cambiar algo y hacé clic sobre el punto exacto del video.</p></div>
    <div id="nueva">
      <div class="sub" id="nueva-donde"></div>
      <textarea id="texto" placeholder="¿Qué cambiarías acá? (ej: este texto más grande, que entre antes, otro color…)"></textarea>
      <div class="acciones"><button class="primario" id="guardar">Guardar nota</button><button id="cancelar">Cancelar</button></div>
    </div>
    <ul id="notas"></ul>
    <div class="acciones">
      <button class="primario" id="copiar">Copiar para Claude</button>
      <button id="borrar">Borrar todas</button>
    </div>
    <p class="ayuda"><kbd>Espacio</kbd> play/pausa · <kbd>←</kbd> <kbd>→</kbd> un cuadro · <kbd>Shift</kbd>+<kbd>←</kbd> <kbd>→</kbd> un segundo · clic en una nota = ir a ese momento</p>
  </div>

<script>
  var FPS = 30, CLAVE = "revisor:{{REEL}}:{{VIDEO}}";
  var v = document.getElementById("v"), esc = document.getElementById("escenario");
  var notas = []; try { notas = JSON.parse(localStorage.getItem(CLAVE) || "[]"); } catch (e) {}
  var pendiente = null;
  function guardarLocal() { try { localStorage.setItem(CLAVE, JSON.stringify(notas)); } catch (e) {} }
  function fmt(t) { var m = Math.floor(t / 60), s = t - m * 60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(2); }
  function cuadro(t) { return Math.round(t * FPS); }
  function pintarTiempo() {
    document.getElementById("tiempo").textContent = fmt(v.currentTime) + " · c" + cuadro(v.currentTime);
    if (v.duration) document.getElementById("scrub").value = Math.round(v.currentTime / v.duration * 1000);
    pintarPins();
  }
  function pintarPins() {
    esc.querySelectorAll(".pin").forEach(function (p) { p.remove(); });
    notas.forEach(function (n, i) {
      if (Math.abs(n.t - v.currentTime) > 0.5) return;
      var p = document.createElement("div"); p.className = "pin"; p.textContent = i + 1;
      p.style.left = n.x + "%"; p.style.top = n.y + "%"; esc.appendChild(p);
    });
    if (pendiente) { var p = document.createElement("div"); p.className = "pin"; p.textContent = "+"; p.style.left = pendiente.x + "%"; p.style.top = pendiente.y + "%"; esc.appendChild(p); }
  }
  function lista() {
    var ul = document.getElementById("notas"); ul.innerHTML = "";
    notas.sort(function (a, b) { return a.t - b.t; });
    notas.forEach(function (n, i) {
      var li = document.createElement("li");
      li.innerHTML = '<span class="n">' + (i + 1) + '</span><div><div class="t">' + fmt(n.t) + " · c" + cuadro(n.t) +
        " · x " + n.x + "% y " + n.y + '%</div><div class="txt"></div></div><button class="x" title="Borrar">✕</button>';
      li.querySelector(".txt").textContent = n.texto;
      li.querySelector(".t").onclick = function () { v.pause(); v.currentTime = n.t; };
      li.querySelector(".x").onclick = function () { notas.splice(i, 1); guardarLocal(); lista(); pintarPins(); };
      ul.appendChild(li);
    });
  }
  esc.addEventListener("click", function (e) {
    v.pause();
    var r = esc.getBoundingClientRect();
    pendiente = { t: +v.currentTime.toFixed(3), x: Math.round((e.clientX - r.left) / r.width * 100), y: Math.round((e.clientY - r.top) / r.height * 100) };
    document.getElementById("nueva-donde").textContent = "Nota en " + fmt(pendiente.t) + " (cuadro " + cuadro(pendiente.t) + "), x " + pendiente.x + "% · y " + pendiente.y + "%";
    document.getElementById("nueva").classList.add("on");
    document.getElementById("texto").focus(); pintarPins();
  });
  document.getElementById("guardar").onclick = function () {
    var txt = document.getElementById("texto").value.trim(); if (!pendiente || !txt) return;
    pendiente.texto = txt; notas.push(pendiente); pendiente = null;
    document.getElementById("texto").value = ""; document.getElementById("nueva").classList.remove("on");
    guardarLocal(); lista(); pintarPins();
  };
  document.getElementById("cancelar").onclick = function () { pendiente = null; document.getElementById("nueva").classList.remove("on"); pintarPins(); };
  document.getElementById("play").onclick = function () { v.paused ? v.play() : v.pause(); };
  v.addEventListener("play", function () { document.getElementById("play").textContent = "❚❚ Pausa"; });
  v.addEventListener("pause", function () { document.getElementById("play").textContent = "▶︎ Play"; });
  v.addEventListener("timeupdate", pintarTiempo); v.addEventListener("seeked", pintarTiempo); v.addEventListener("loadedmetadata", pintarTiempo);
  function paso(d) { v.pause(); v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + d)); }
  document.getElementById("atras").onclick = function () { paso(-1 / FPS); };
  document.getElementById("adelante").onclick = function () { paso(1 / FPS); };
  var velocidades = [1, 0.5, 0.25], vi = 0;
  document.getElementById("lento").onclick = function () { vi = (vi + 1) % velocidades.length; v.playbackRate = velocidades[vi]; this.textContent = "Velocidad " + velocidades[vi] + "×"; };
  document.getElementById("verzona").onclick = function () { document.getElementById("zona").classList.toggle("on"); };
  document.getElementById("scrub").oninput = function () { if (v.duration) { v.pause(); v.currentTime = this.value / 1000 * v.duration; } };
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.code === "Space") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    if (e.code === "ArrowLeft") paso(e.shiftKey ? -1 : -1 / FPS);
    if (e.code === "ArrowRight") paso(e.shiftKey ? 1 : 1 / FPS);
  });
  document.getElementById("copiar").onclick = function () {
    var txt = "Revisión de {{REEL}} ({{VIDEO}}):\n" + notas.map(function (n, i) {
      return (i + 1) + ". [" + fmt(n.t) + " · cuadro " + cuadro(n.t) + " · x " + n.x + "% y " + n.y + "%] " + n.texto;
    }).join("\n");
    navigator.clipboard.writeText(txt).then(function () { document.getElementById("copiar").textContent = "¡Copiado! Pegámelo en el chat"; setTimeout(function () { document.getElementById("copiar").textContent = "Copiar para Claude"; }, 2500); });
  };
  document.getElementById("borrar").onclick = function () { if (confirm("¿Borrar todas las notas?")) { notas = []; guardarLocal(); lista(); pintarPins(); } };
  lista();
</script>
</body>
</html>
